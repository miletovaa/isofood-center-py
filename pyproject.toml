[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "o2org"
version = "0.1.0"
description = "Python client for o2_org_dma"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "pandas>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
notebook = ["jupyter", "ipykernel"]
pipelines = [
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.2",
    "statsmodels>=0.14",
    "plotly>=5.18",
    "kaleido>=0.2.1",
]
ui = [
    "o2org[pipelines]",
    "streamlit>=1.32",
    "openpyxl>=3.1",
]

[project.scripts]
o2org-ui = "o2org.ui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/o2org"]

[tool.pytest.ini_options]
pythonpath = ["src"]
