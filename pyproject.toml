[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "o2org"
version = "0.1.0"
description = "Python client and easy statistics/ML toolkit for o2_org_dma"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "pandas>=1.5",
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
notebook = ["jupyter", "ipykernel"]

[tool.hatch.build.targets.wheel]
packages = ["src/o2org"]

[tool.pytest.ini_options]
pythonpath = ["src"]
