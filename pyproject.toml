[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isofood-center"
version = "0.1.0"
description = "Python client and analysis pipelines for the ISOFood Center database (o2_org_dma)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "pandas>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
notebook = ["jupyter", "ipykernel"]
pipelines = [
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.2",
    "statsmodels>=0.14",
    "plotly>=5.18",
    "kaleido>=0.2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/isofood_center"]

[tool.pytest.ini_options]
pythonpath = ["src"]
